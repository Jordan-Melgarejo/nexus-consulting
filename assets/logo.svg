<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 54" fill="none">
  <!-- Dynamic Growth Icon Mark -->
  <g id="mark">
    <rect x="2" y="2" width="50" height="50" rx="14" fill="#111827" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- Ascending geometric pillars -->
    <rect x="12" y="30" width="6" height="14" rx="3" fill="#38BDF8" opacity="0.8"/>
    <rect x="22" y="22" width="6" height="22" rx="3" fill="#00D285" opacity="0.9"/>
    <rect x="32" y="14" width="6" height="30" rx="3" fill="#00E599"/>
    <!-- Growth trajectory accent arrow -->
    <path d="M14 26 L24 17 L36 10 M36 10 L30 10 M36 10 L36 16" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Typography: GROW SOLUTIONS -->
  <g id="type" transform="translate(64, 15)">
    <text x="0" y="18" fill="#F8FAFC" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" letter-spacing="1.2">GROW</text>
    <text x="70" y="18" fill="#00D285" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" letter-spacing="1.2">.</text>
    <text x="0" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" letter-spacing="3.5">SOLUTIONS</text>
  </g>
</svg>
